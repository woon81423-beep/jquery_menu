<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p>양수 음수 구분하는 if문</p>

    <script>
      let num01 = Number(prompt("숫자를 입력하세요"));
      if (num01 % 2 == 0) {
        document.write(`당신이 입력한 숫자는 ${num01}이며 짝수입니다`);
      } else if (num01 % 2 == 1) {
        document.write(`당신이 입력한 숫자는 ${num01}이며 홀수입니다`);
      }

      let num02 = Number(prompt("숫자를 입력하세요"));
      if (num02 > 0) {
        document.write(`당신이 입력한 숫자는 ${num02}이며 양수입니다`);
      } else if (num02 < 0) {
        document.write(`당신이 입력한 숫자는 ${num02}이며 음수입니다`);
      } else {
        document.write(`당신이 입력한 숫자는 ${num02}입니다`);
      }
    </script>
  </body>
</html>
<!--
1.숫자를 입력받아서 입력받은 숫자가 짝수이면 당신이 입력한 숫자는 -이며 짝수입니다.
입력받은 숫자가 홀수이면 당신이 입력한 숫자는 -이며 홀수입니다.

2.숫자를 입력받아서 0보다 크면 양수입니다.
0이면 0입니다.
0보다 작으면 음수입니다. 
-->
