<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>this</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      ul {
        list-style: none;
      }
      li {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>list01</li>
      <li>list02</li>
      <li>list03</li>
      <li>list04</li>
    </ul>
    <script>
        // 오답: 전체 li 글자 컬러가 변경됨
      //   $("li").on("click", function () {
      //     $("li").css({ color: "red" });
      //   });
        //정담 : 원시적인 방법. li 갯수가 많아지면 그만큼 만들어야하기 때문에 너무 복잡해짐
    //   $("li:nth-of-type(1)").on("click", function () {
    //     $("li").css({"color":"black"});
    //     $("li:nth-of-type(1)").css({ color: "red" });
    //   });

    //   $("li:nth-of-type(2)").on("click", function () {
    //     $("li").css({"color":"#000"});
    //     $("li:nth-of-type(2)").css({ color: "red" });
    //   });

        $("li").on("click", function(){
            $("li").css({"color":"#000"});
            $(this).css({"color":"red"});
        })
    </script>
  </body>
</html>
<!--
*this:이벤트가 발생한 해당 요소를 가리킬때 사용
(이벤트가 발생한 이것을 가리킴)
this에는 ""(따옴표)를 쓰지 않음.

$("선택자").on("이벤트", function(){
$(this).
})
