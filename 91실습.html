<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      .wrap {
        background-color: #ccc;
        width: 600px;
        height: 400px;
        margin: 50px;
        position: relative;
      }
      .top {
        width: 0%;
        height: 2px;
        background-color: #000;
      }
      .right {
        width: 2px;
        height: 0;
        background-color: #000;
        position: absolute;
        right: 0px;
        top: 0px;
      }
      .bottom {
        width: 0;
        height: 2px;
        background-color: #000;
        position: absolute;
        right: 0px;
        bottom: 0px;
      }
      .left {
        width: 2px;
        height: 0;
        background-color: #000;
        position: absolute;
        left: 0px;
        bottom: 0px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top"></div>
      <div class="right"></div>
      <div class="bottom"></div>
      <div class="left"></div>
    </div>
    <script>
      $(".top")
        .stop()
        .animate({ width: "100%" }, 500, function () {
          $(".right")
            .stop()
            .animate({ height: "100%" }, 500, function () {
              $(".bottom")
                .stop()
                .animate({ width: "100%" }, 500, function () {
                  $(".left").stop().animate({ height: "100%" });
                });
            });
        });
    </script>
  </body>
</html>
