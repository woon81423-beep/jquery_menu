<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        word-break: keep-all;
      }
      ul {
        list-style: none;
        margin:50px 0px 0px 0px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      ul {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      li {
        width: 150px;
        height: 50px;
        border: 1px solid #ccc;
        border-radius: 50px;
        text-align: center;
        line-height: 50px;
        overflow: hidden;
        position: relative;
      }
      a {
        width: 100%;
        height: 100%;
        /* background-color: #ccc; */
        display: inline-block;
      }
      li:nth-of-type(1) a::before {
        content: "";
        background-color: red;
        width: 100%;
        height: 100%;
        display: inline-block;
        transform: translateY(100%);
        transition: 0.5s;
        position: absolute;
        left: 0px;
        top: 0px;
        z-index: -1;
      }
      li:nth-of-type(2) a::before {
        content: "";
        background-color: red;
        width: 100%;
        height: 100%;
        display: inline-block;
        transform: translateY(-100%);
        transition: 0.5s;
        position: absolute;
        left: 0px;
        top: 0px;
        z-index: -1;
      }
      li:nth-of-type(3) a::before {
        content: "";
        background-color: red;
        width: 100%;
        height: 100%;
        display: inline-block;
        transform: translateX(-100%);
        transition: 0.5s;
        position: absolute;
        left: 0px;
        top: 0px;
        z-index: -1;
      }
      li:nth-of-type(4) a::before {
        content: "";
        background-color: red;
        width: 100%;
        height: 100%;
        display: inline-block;
        transform: translateX(100%);
        transition: 0.5s;
        position: absolute;
        left: 0px;
        top: 0px;
        z-index: -1;
      }
      li:nth-of-type(5) a::before {
        content:"";
        background-color:teal;
        width:100%;
        height:100%;
        display:inline-block;
        transform:translateY(-100%);
        transition:0.8s;
        position:absolute;
        left:0px;
        top:0px;
        z-index:-1;
      }
      li.active a::before {
        transform: translateY(0);
      }

    </style>
  </head>
  <body>
    <ul>
      <li><a href="#">버튼1</a></li>
      <li><a href="#">버튼2</a></li>
      <li><a href="#">버튼3</a></li>
      <li><a href="#">버튼4</a></li>
      <li><a href="#">버튼5</a></li>
    </ul>
    <script>
      $("li").on("mouseenter", function () {
        $(this).addClass("active");
      });
      $("li").on("mouseleave", function () {
        $(this).removeClass("active");
      });
      //$("li").on("mouseleave")
    </script>
  </body>
</html>
