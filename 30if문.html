<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        num = 3;
        if(num == 3) {
            console.log(num)
        }
        console.log("조건을 만족하지 못함")
    </script>
</body>
</html>

실행문
}
::소괄호안에 있는 조건이 만족이 되면 중괄호 안으로 들어가서 실행이 됨

변수 = 데이터값( = 이 하나이면 오른쪽에 있는 데이터값을 왼쪽 변수에 담아라)
변수 == 데이터값 ( == 이 두개면 변수에 있는 값하고 데이터 값이 같다)

변수명 :: 영문, 대소문자, 숫자, _(언더바)
변수는 대소문자를 구분함
변수명의 첫글자는 영문, 언더바가 올 수 있음. *숫자는 안됨.
변수명으로 공백, 다른 특수문자 안됨
