<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        word-break: keep-all;
      }
      ul {
        list-style: none;
      }
      .wrap {
        display: flex;
        gap: 30px;
      }
      .wrap div {
        width: 500px;
        /* position: relative; */
      }
      .wrap img {
        /* position: absolute;
        left: 0px;
        top: 0px; */
        display: none;
      }
      .wrap img:first-child {
        display: block;
      }
      ul li {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>SHOP THE ROOM</h2>
    <div class="wrap">
      <div>
        <img src="img/pic1.jpg" alt="" />
        <img src="img/pic2.jpg" alt="" />
        <img src="img/pic3.jpg" alt="" />
      </div>
      <ul>
        <li>Living Room</li>
        <li>Dining Room</li>
        <li>Bed Room</li>
      </ul>
    </div>
    <script>
      $("li:nth-of-type(1)").on("click", function () {
        $("div img").hide();
        $("div img:nth-of-type(1)").show();
      });
      $("li:nth-of-type(2)").on("click", function () {
        $("div img").hide();
        $("div img:nth-of-type(2)").show();
      });
      $("li:nth-of-type(3)").on("click", function () {
        $("div img").hide();
        $("div img:nth-of-type(3)").show();
      });
    </script>
  </body>
</html>
