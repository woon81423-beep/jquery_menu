<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let total = 0;
      for (let i = 1; i <= 10; i++) {
        total = total + i;
        console.log(`1에서 ${i}까지의 합은 ${total}이다`);
      }
      console.log(total);
      //let total = 0; // 1. 주머니(total)를 준비하고 숫자 0을 넣어둡니다.

      //for (let i = 1; i <= 3; i++) { // 2. 손가락(i)을 1부터 3까지 늘려가며 반복합니다.
      total = total + i; // 3. 기존 주머니 값에 손가락 번호를 더해 다시 주머니에 넣습니다.
      console.log(total); // 4. 지금 주머니에 뭐가 들었는지 화면에 적어봅니다.
    </script>
  </body>
</html>

1.1부터 3까지여 합계를 구하고 싶음
1,2,3 > 3번 반복 >반복문 사용

*합계
합계를 구하라는 말이 나오면 누저겡 해당하는 식을 세움
1.합계 변수 만듬.(total / sum)
2.for문으로 반복문을 만듬( 데이터값을 for문으로 만듬)
예를 들어 1부터 10까지라면 for(let i=1; i ,<=10; i+1)
3.for문 안에는 함계 구하는 공식을 쓰면 됨
total = total + i
