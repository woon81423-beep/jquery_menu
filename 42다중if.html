<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = 0;
        if(num > 0) {
            console.log("양수입니다")
        } else if(num < 0){
            console.log("음수입니다")
        } else {
            console.log("0입니다.")
        }
    </script>
</body>
</html>
<!--
*다중if
if문이 여러번 나옴.
if문이 여러번 나온다는 것은 조건이 여러개라는 뜻

if(조건1 이 참이면) {
조건1이 참일 때 실행문
} else if( 조건2가 참이면) {
조건2 참일때 실행문
} else if(조건 3이 참이면) {
조 3이 참일때 실행문
} else {
모든 조건을 다 만족하지 못했을 때 실행문
-->
