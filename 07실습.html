<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        word-break: keep-all;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      /**/
      ul {
        width: 90%;
        font-size: 0.9rem;
        margin: 0px auto;
        cursor: pointer;
      }
      li {
        border-bottom: 1px solid #ccc;
        margin: 0.5rem;
        padding: 20px;
      }
      li > div {
        /* background-color: orange; */
        display: flex;
        justify-content: space-between;
        margin: 0.5rem 0rem;
        transition: 0.2s;
        align-items: center;
      }
      li p {
        display: none;
      }
      p {
        font-size: 1rem;
        margin: 0.5rem 0rem;
      }
      i {
        transition: 0.3s;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>
        <div>
          <h2 class="wrap01">
            Interactive SDK를 우리 서비스에 연동하는 데 얼마나 걸리나요?
          </h2>
          <i class="fa-solid fa-plus"></i>
        </div>
        <p class="box01">
          기본 연동은 JavaScript/REST API 기반으로 통상 1~3일 이내 가능합니다.
          커스텀 퍼소나 설정 및 지식베이스 구성에는 추가 1~2주가 소요됩니다.
        </p>
      </li>
      <li>
        <div>
          <h2 class="wrap02">지원 환경은 어떻게 되나요?</h2>
          <i class="fa-solid fa-plus"></i>
        </div>
        <p class="box02">
          Web(JavaScript), iOS, Android, 키오스크(Electron) 환경을 지원합니다.
          특수 환경의 경우 기술 팀과 사전 협의가 필요합니다.
        </p>
      </li>
    </ul>

    <script>
      // $("li:nth-of-type(1)").on("click", function () {
      //   $("li:nth-of-type(1) p").slideToggle(300);
      //   $("div").css({ color: "black" });
      //   $("li:nth-of-type(1) div").css({ color: "blue" });
      //   $("i").css({ transform: "rotate(0deg)" });
      //   $("li:nth-of-type(1) i").css({ transform: "rotate(45deg)" });
      // });
      // $("li:nth-of-type(2)").on("click", function () {
      //   $("li:nth-of-type(2) p").slideToggle(300);
      //   $("div").css({ color: "black" });
      //   $("li:nth-of-type(2) div").css({ color: "blue" });
      //   $("i").css({ transform: "rotate(0deg)" });
      //   $("li:nth-of-type(2) i").css({ transform: "rotate(45deg)" });
      // });

      $("li").on("click", function(){
        $("h2").css({"color":"#000"});
        $(this).children("p").slideToggle(300);
        $("h2").css({"color":"blue"});
        $("i").css({ transform: "rotate(0deg)" });
      })
    </script>
  </body>
</html>
