<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      for (let i = 1; i <= 10; i++) {
        if (i % 2 == 1) {
          console.log(`1~10 중 홀수는 ${i}이다`);
        }
      }
      let num = Number(prompt("쓰고싶은 숫자를 입력해주세요"));
      for (let a = 1; a <= num; a++) {
        console.log(`1부터 ${num}까지의 숫자는 ${a}이다.`);
      }
    </script>
  </body>
</html>
