<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      .box {
        width: 150px;
        height: 150px;
        background-color: antiquewhite;
      }
    </style>
  </head>
  <body>
    <p class="hello">hello</p>
    <div class="box"></div>
    <script>
    $(".box").text(`라푸라푸`)
    $("p").html(`<h2>안녕하시</h2>`)
    </script>
  </body>
</html>
<!--
*$("선택자").text("변경내용") ::선택한 요소의 텍스트 내용을 변경할 수 있음.
*$("선택자").text() :: 선택한 요소의 텍스트를 가지고 오기

*$("선택자").html("html요소") :: 선택한 요소의 내용을 새로운 html 요소로 변경 할 수 있음.

-->
