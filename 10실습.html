<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      ul {
        list-style: none;
      }

      .bg {
        width: 100vw;
        height: 100vh;
        background-color: bisque;
      }
      .bg i {
        position: absolute;
        right: 1%;
        top: 1%;
        cursor: pointer;
      }
      .hide {
        width: 100vw;
        height: 100vh;
        background-color: rgb(255, 142, 4);
        display: none;
        position: absolute;
        top: 0%;
        left: 0%;
      }
      .hide ul {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        font-size: 2rem;
        width: 100%;
        height: 100%;
        text-align: center;
        color: #fff;
      }
      ul li {
        cursor: pointer;
        transition: all 500ms cubic-bezier(0.33, 1, 0.68, 1);
        transition-delay: var(--delay);
        opacity: 1;
        transform: translateY(10);
        --delay: calc(250ms + 0ms);
      }

      .exit i {
        position: absolute;
        right: 1%;
        top: 1%;
        cursor: pointer;
        display: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="bg"><i class="fa-solid fa-bars"></i></div>
    <div class="exit"><i class="fa-solid fa-x"></i></div>
    <div class="hide">
      <ul>
        <li>창업기</li>
        <li>성장기</li>
        <li>성숙기</li>
        <li>제2의 성장기</li>
        <li>오늘의 한진, 미래의 한진</li>
      </ul>
    </div>
    <script>
      $(".bg i").on("click", function () {
        $(".exit i").show(900);
        $(".hide").slideDown(900);
      });

      $(".exit i").on("click", function () {
        $(".bg").slideUp(500);
      });

      //   $(".bg i").on("click",function(){

      //   })

      //   })
      //   $(".bg i").on("click",function(){
      //     $("ul li:nth-of-type(3)").slideDown(700);
      //   })
      //   $(".bg i").on("click",function(){
      //     $("ul li:nth-of-type(4)").slideUp(800);
      //   })
      //   $(".bg i").on("click",function(){
      //     $("ul li:nth-of-type(5)").slideUp(100);
      //   })
    </script>
  </body>
</html>
