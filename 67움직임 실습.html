<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/jquery-4.0.0.min.js"></script>
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      div {
        width: 400px;
        height: 200px;
        overflow: hidden;
        position: relative;
        border: 1px solid red;
        margin: 10px auto;
      }
      ul {
        list-style: none;
        display: flex;
        position: absolute;
        top: 0;
        left: 0;
      }

      img {
        width: 100%;
        object-fit: cover;
        transition: 1s;
      }
      li {
        width: 400px;
        height: 200px;
        left: 0%;
        top: 0%;
      }
      .wrap {
        left: -400px;
      }
    </style>
  </head>
  <body>
    <div>
      <ul>
        <li><img src="img/pic1.jpg" alt="" /></li>
        <li><img src="img/pic2.jpg" alt="" /></li>
        <li><img src="img/pic3.jpg" alt="" /></li>
        <li><img src="img/pic4.jpg" alt="" /></li>
      </ul>
    </div>
    <script>
      let count = $("li").length;
      console.log(count);

      for (let i = 0; i < count; ++i) {
        $("li")
          .eq(i)
          .on("click", function () {
            if (i == 3) {
              $("ul").stop().animate({ "margin-left": "0px" });
            } else {
              $("ul")
                .stop()
                .animate({ "margin-left": `${-400 *(i+1)}` });
            }
          });
      }

</html>
