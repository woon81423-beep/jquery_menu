<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num = 10;
      console.log(++num);
      console.log(--num);
    </script>
  </body>
</html>
<!--
*증감연산자
i = i + 1 (i 라는 변수에 1을 더한 후 i라는 변수에 넣어라)
==> i++

i = i - 1 (i라는 변수에 1을 빼서 i라는 변수에 넣어라)
==> i--
-->
