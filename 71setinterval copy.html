<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/jquery-4.0.0.min.js"></script>

    <title>Document</title>
  </head>
  <body>
    <script>
      $(function () {
        let i = 0;
        setInterval(function () {
          if (i == 5) {
            i = 0;
          } else {
            i = i + 1;
            console.log(i);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
<!--
*setInterval()은 설정된 시간마다 반복하는 함수
setInterval(function(){
실행문
},밀리초)
clearInterval()은 setInterval을 중지시킬 수 있음
단 중지를 하려면 setInterval을 변수에 넣음
clearInterval(변수) :: 변수에 담긴것을 중지시킴

변수 = setInterval(function(){
실행문
},밀리초)
