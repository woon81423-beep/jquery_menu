<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style></style>
  </head>
  <body>

    <button>숨기기</button>
    <div>링크글자</div>
    <p>숨기기2</p>
    <script>
    //   $("button").on("click", function () {
    //     $("div").hide();
    //   });

        function txt(){
            $("div").hide()
        }
        $("button").on("click",function(){
            txt()
        })
        $("p").on("click",function(){
            txt()
        })
    </script>
  </body>
</html>
<!--
*함수(function) :: 실행문을 만들어 놓은 코드
-반복적인 실행문을 코드로 만들어 두고 호출해서 사용이 가능

함수를 만드는 기본 형식
function 함수이름(){
실행문
}

함수는 호출을 해야 실행이 됨.
호출은 함수이름()
-->
