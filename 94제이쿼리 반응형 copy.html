<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      div {
        width: 100%;
        height: 100px;
        background-color: aquamarine;
      }
    </style>
  </head>
  <body>
    <div></div>

    <script>
     
      function re() {
        let w = $(window).width();
        console.log(w);
        if (w >= 1200) {
          $("div").css({ "background-color": "#000" });
        } else if (w <= 768) {
          $("div").stop().animate({ rotate: "45deg" });
        } else {
          $("div").stop().animate({ opacity: "0.5" });
        }
      }
      re();
      $(window).on("resize", function () {
        re();
      });
    </script>
  </body>
</html>
