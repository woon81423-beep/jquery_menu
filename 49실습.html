<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js_enter/49실습.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      div {
        width: 100px;
        height: 100px;
        background-color: orange;
        position: fixed;
        left: 0px;
        top: 0px;
        transition: color 0.5s;
      }
      body {
        height: 2000px;
      }
      .on {
        color: #fff;
        background-color: #222;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div>글자</div>
  </body>
  <script>
    $(window).on("scroll", function () {
      let wrap01 = $(this).scrollTop();
      // console.log(wrap01);
      if (wrap01 >= 200 && wrap01 <= 500) {
        $("div").addClass("on");
      } else {
        $("div").removeClass("on");
      }
    });
  </script>
</html>
