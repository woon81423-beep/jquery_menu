<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      div {
        width: 50%;
        height: 100px;
        background-color: #ccc;
        margin: 50px auto;
      }
      .change {
        color: red;
        background-color: #000;
        border: 1px solid red;
        width: 30%;
        height: 50px;
        transform: scale(1.5);
      }
    </style>
  </head>
  <body>
    <div>박스</div>
    <button class="btn01">글자색</button>
    <button class="btn02">배경색</button>
    <button class="btn03">테두리</button>
    <button class="btn04">너비</button>
    <button class="btn05">높이</button>
    <button class="btn06">크기</button>
    <button class="btn07">초기화</button>
    <button class="btn07">토글</button>
    <button class="btn07">add</button>
    <button class="btn07">remove</button>
    <script>
      $(".btn01").on("click", function () {
        $("div").toggleClass("change");
      });
      $(".btn02").on("click", function () {
        $("div").addClass("change");
      });
      $(".btn03").on("click", function () {
        $("div").removeClass("change");
      });
