<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>

    <style>
      ul {
        display: flex;
        width: 900px;
        margin: 50px auto;
        list-style: none;
      }
      img {
        width: 100%;
      }
      body {
        text-align: center;
      }
      li {
        transition: 0.5s;
      }
    </style>
  </head>
  <body>
    <ul>
      <li><img src="img/pic1.jpg" alt="" /></li>
      <li><img src="img/pic2.jpg" alt="" /></li>
      <li><img src="img/pic3.jpg" alt="" /></li>
    </ul>
    <button class="prev">앞</button>
    <button class="next">뒤</button>

    <script>
      $(".prev").on("click", function () {
        $("li:last-child").prependTo("ul");
      });
      $(".next").on("click", function () {
        $("li:first-child").appendTo("ul");
      });
    </script>
  </body>
</html>
<!--
앞버튼을 클릭하면 뒤에있는 li가 ul앞으로 옴
뒤버튼을 클릭하면 앞에있는 li가 ul뒤로 옴

$(function () {
  $(".prev").on("click", function () {
    $("li:nth-of-type(3)").prependTo("ul");
  });
  $(".next").on("click", function () {
    $("li:nth-of-type(1)").appendTo("ul");
  });
});

-->
