    <link rel="stylesheet" href="css/97style.css" />
    <script

  <body>
    <nav>
      <ul class="ft">
        <li>
          <a href="#" class="wrap01">여행가이드 소개</a>
        </li>
        <li>
          <a href="#" class="wrap02">국내여행지</a>

            <li><a href="#">충청도</a></li>
            <li><a href="#">전라도</a></li>

        <li>

    <script>
      $(function () {
        $(".ft > li").on("click", function () {
          $(".ft > li").css({ "background-color": " aquamarine;" });
          $(".sub").css({ "background-color": "tomato" });
          $(".sub").hide();
          $(this).find(".sub").show();
        });
      });
    </script>
