<!--
jQuery는 JavaScript를 더 쉽고 더 편하게 사용할 수 있도록 만들어진 JavaScript

라이브러리임 html과 css를 이용해서 움직임을 만들어주는 라이브러리 

==제이쿼리 형식==
$("선택자").on("이벤트", function(){ 
움직이는 실행문 }) 

선택자 :: 태그,
클래스명, 아이디명.... 어떤 선택자한테 이벤트를 줄건지를 입력하면 됨 
이벤트 ::
클릭, 마우스오버, 마우스아웃, 스크롤.... 
예를 들면 
$(".logo").on("click",
function() { 움직임 }) 

html :: 마크업언어(HyperText Markup Language) 
==> 구조를 표시함

css :: Cascading Style Sheets 
 ==> 스타일을 지정, 예쁘게 꾸밈

 jQuery :: JavaScript 라이브러리 
==> 움직임을 만듦 

포폴에는 홈페이지를 만들때 제이쿼리,
gsap을 가지고 만들 예정임 자바스크립트는 api를 연동해서 날씨, 영화
-->
