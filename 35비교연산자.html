<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num1 = 10;
      let num2 = 3;
      console.log(num1 > num2);
      console.log(num1 >= num2);
      console.log(num1 < num2);
      console.log(num1 <= num2);
      console.log(num1 == num2);
      console.log(num1 != num2);
      console.log(num1 !== num2);
    </script>
  </body>
</html>

뜻

~보다 크다 (초과)

age >= 20
작거나 같다 (이하)
<=
age <= 20
같다
== 또는 ===
age == 20
같지 않다 (다르다)
!= 또는 !==
age != 20-->
