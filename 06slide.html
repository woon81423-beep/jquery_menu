<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      div {
        width: 50%;
        height: 200px;
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <div>박스</div>
    <button class="btn01">slideUP</button>
    <button class="btn02">slideDown</button>
    <button class="btn03">slideToggle</button>
    <script>
      $(".btn01").on("click", function () {
        $("div").slideUp(1000);
      });
      $(".btn02").on("click", function () {
        $("div").slideDown(1000);
      });
      $(".btn03").on("click", function () {
        $("div").slideToggle(1000);
      });
    </script>
  </body>
</html>
