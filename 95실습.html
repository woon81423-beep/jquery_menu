<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/egjs-jquery-transform/2.0.0/transform.min.js"
      integrity="sha512-vOc3jz0QulHRiyMXfp676lHxeSuzUhfuw//VUX12odAmlUbnKiXH4GQxBRqwKhF3Mkswqr5ILY9MtEM4ZwcS2A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      div {
        width: 100px;
        height: 100px;
        background-color: rgb(255, 127, 244);
        margin:100px;
        /* transition: 1s;
        transform: scale(); */
      }
    </style>
  </head>
  <body>
    <div></div>

    <script>
      function res() {
        let w = $(window).width();
        console.log(w);
        if (w >= 1200) {
          $("div").css({ transform: "translateX(500px)" });
        } else if (w >= 768) {
          $("div").css({ transform: "scale(5)" });
        } else {
          $("div").css({ transform: "rotate(45deg)" });
        }
      }
      res();

      $(window).on("resize", function () {
        res();
      });
    </script>
  </body>
</html>
<!--
div를 하나 만들기
pc버전에서는 div를 x축으로 이동
태블릿에서는 div를 scale로 확대
모바일에서는 div를 rotate시키기
단 조건은 animate이용
-->
