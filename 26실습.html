<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      ul {
        list-style: none;
        display: flex;
        gap: 30px;
        color: #fff;
        margin: 50px 0px;
      }
      li {
        overflow: hidden;
        width: 100px;
        height: 50px;
        border-radius: 50px;
        text-align: center;
        position: relative;
        cursor: pointer;
      }
      li div:nth-of-type(1) {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        backface-visibility: hidden;
        background-color: rgb(0, 110, 255);
      }
      li div:nth-of-type(2) {
        background-color: rgb(255, 136, 0);
        width: 100%;
        height: 100%;
        position: absolute;
        top: -100%;
        left: 0;
      }
      li div:last-child {
        z-index: 20;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
      li:hover {
        color: blueviolet;
      }
      li div:last-child p {
  text-align: center; /* 가로 중앙 정렬 */
  line-height: 50px;  /* 세로 중앙 정렬 (부모 height인 50px과 동일하게 설정) */
}
    </style>
    <title>Document</title>
  </head>
  <body>
    <ul>
      <li>
        <div></div>
        <div></div>
        <div><p>INCUIRE</p></div>
      </li>
      <li>
        <div></div>
        <div></div>
        <div><p>VIEW</p></div>
      </li>
    </ul>
    <script>
      $("li").on("mouseenter", function () {
        $(this).children("div:nth-of-type(2)").stop().animate({ top: "0%" });
      });
      $("li").on("mouseleave", function () {
        $(this).children("div:nth-of-type(2)").stop().animate({ top: "-100%" });
      });
    </script>
  </body>
</html>
