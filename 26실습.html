<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      ul {
        list-style: none;
        display: flex;
        gap: 30px;
        color:#fff;
      }
      li {
        overflow: hidden;
        width: 100px;
        height: 50px;
        /* background-color: aqua; */
        border-radius: 50px;
        text-align: center;
        position: relative;
        cursor: pointer;
      }
      li div:nth-of-type(1) {
        background-color: rgb(0, 110, 255);
        width: 100px;
        height: 50px;
        position: absolute;
        top: 0;
        left: 0;
      }
      li div:nth-of-type(2) {
        background-color: rgb(255, 136, 0);
        width: 100px;
        height: 50px;
        position: absolute;
        top: -100%;
        left: 0;
      }
      li div:last-child {
        z-index: 20;
        width: 100px;
        height: 50px;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <ul>
      <li>
        <div></div>
        <div></div>
        <div><p>INCUIRE</p></div>
      </li>
      <li>
        <div></div>
        <div></div>
        <div><p>VIEW</p></div>
      </li>
    </ul>
    <script>
      $("li").on("mouseenter", function () {
        $(this).children("div:nth-of-type(2)").animate({ top: "0%" });
      });
      $("li").on("mouseleave", function () {
        $(this).children("div:nth-of-type(2)").animate({ top: "-100%" });
      });
    </script>
  </body>
</html>
