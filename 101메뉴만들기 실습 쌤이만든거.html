<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        word-break: keep-all;
      }
      ul {
        list-style: none;
      }
      /*visual*/
      #visual section {
        width: 100%;
        height: 300px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        display: none;
      }
      #visual section:nth-of-type(1) {
        background-color: lightpink;
      }
      #visual section:nth-of-type(2) {
        background-color: lightblue;
      }
      #visual section:nth-of-type(3) {
        background-color: lightgreen;
      }
      #visual section.on {
        display: flex;
      }

      /*container*/
      #container {
        margin-top: 30px;
      }
      .tab {
        display: flex;
        border-bottom: 1px solid orange;
      }
      .tab li {
        padding: 10px 20px;
        color: #333;
        cursor: pointer;
      }
      .tab li:nth-of-type(1).on {
        background-color: lightpink;
      }
      .tab li:nth-of-type(2).on {
        background-color: lightblue;
      }
      .tab li:nth-of-type(3).on {
        background-color: lightgreen;
      }
      .tab li.on {
        border-top: 5px solid orange;
        border-left: 1px solid #333;
        border-right: 1px solid #333;
        /* border-bottom: transparent; */
        margin: -5px -1px -1px -1px;
      }
      /*txt*/
      #container .txt {
        width: 100%;
        height: 200px;
      }
      #container section {
        width: 100%;
        height: 100%;
        background-color: #ccc;
        display: none;
      }
      #container section p {
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #container section.on {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="visual">
      <section class="on">
        <h2>MENU1</h2>
        <p>상품설명입니다</p>
      </section>
      <section>
        <h2>MENU2</h2>
        <p>상품설명입니다</p>
      </section>
      <section>
        <h2>MENU3</h2>
        <p>상품설명입니다</p>
      </section>
    </div>
    <div id="container">
      <ul class="tab">
        <li class="on">MENU1</li>
        <li>MENU2</li>
        <li>MENU3</li>
      </ul>
      <div class="txt">
        <section class="on">
          <p>상품설명입니다 MENU1</p>
        </section>
        <section>
          <p>상품설명입니다 MENU2</p>
        </section>
        <section>
          <p>상품설명입니다 MENU3</p>
        </section>
      </div>
    </div>
    <script>
      $(".tab li").on("click", function () {
        let i = $(this).index();
        $(".tab li").removeClass("on");
        $(".tab li").eq(i).addClass("on");

        $("#visual section").removeClass("on");
        $("#visual section").eq(i).addClass("on");
        $("#container section").removeClass("on");
        $("#container section").eq(i).addClass("on");
      });
    </script>
  </body>
</html>
