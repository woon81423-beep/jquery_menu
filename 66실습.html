<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
  </head>
  <body>
    <ul>
      <li>메뉴1</li>
      <li>메뉴2</li>
      <li>메뉴3</li>
      <li>메뉴4</li>
    </ul>
    <script>
      //   for(let i =0; i <=3; ++i){
      //     $("li").eq(i).css({"color":"red"})
      //   }

      for (let i = 0; i <= 3; ++i) {
        if (i % 2 == 0) {
          $("li").eq(i).css({ color: "red" });
        }
      }
    
    </script>
  </body>
</html>
<!--
li의 글자색 변경
eq는 0부터 시작함

홀수번째 li에만 배경색을 넣기
-->
