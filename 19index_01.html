<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      ul {
        list-style: none;
      }
      ul {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 20px 0px;
      }
      .btn li {
        background-color: #ccc;
      }
      li {
        border: 1px solid transparent;
      }
      .on {
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <ul class="txt">
      <li>list01</li>
      <li>list02</li>
      <li>list03</li>
      <li>list04</li>
    </ul>
    <ul class="btn">
      <li>버튼1</li>
      <li>버튼2</li>
      <li>버튼3</li>
      <li>버튼4</li>
    </ul>
    <script>
      $(".btn li").on("click", function () {
        i = $(this).index(); //클릭한 li의 순번을 i라는 변수에 넣어라
        // console.log(i);  //콘솔창에 i 변수에 있는 값을 출력해라
        // $(".txt li").css({ border: "none" });
        // $(".txt li").eq(i).css({ border: "1px solid red" });
        $(".txt li").removeClass("on");
        $(".txt li").eq(i).addClass("on");
      });
    </script>
  </body>
</html>
