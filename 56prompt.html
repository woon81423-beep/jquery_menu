<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      ul {
        list-style: none;
      }
    </style>
  </head>
  <body>
    <script>
    //   let st = prompt("좋아하는 계절을 입력해주세요");
    //   console.log(st)

    let num = prompt("좋아하는 숫자를 입력해주세요")
    console.log(num);
    console.log(typeof num);
    </script>
  </body>
</html>
<!--
*prompt("원하는 문구")
-화면에 입력 창이 나타나면 원하는 글자를 입력할 수 있음.
입력을 하면 그 해당 데이터는 변수 안에 저장을 해야함.
-원하는 문구를 화면에 나타남(사용자한테 보여주는 메세지)
-입력한 데이터는 문자로 취급됨

-typeof는 데이터의 타입을 알 수 있음
문자는 string
숫자는 number
-->
