<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      ul {
        list-style: none;
      }

      #containar section {
        width: 100%;
        height: 100vh;
      }
      #page01 {
        background-color: aquamarine;
      }
      #page02 {
        background-color: rgb(130, 101, 255);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        text-align: center;
        gap: 30px;
      }

      #page02 h2 {
        margin-bottom: 30px;
        transform: translateY(50px);
        transition: 0.5s;
        opacity: 0;
      }
      #page02 p {
        transform: translateY(50px);
        transition: 0.5s;
        transition-delay: 0.5s;
        opacity: 0;
      }
      #page02.on h2 {
        transform: translateY(0);
        opacity: 1;
      }
      #page02.on p {
        transform: translateY(0);
        opacity: 1;
      }
      #page03 {
        background-color: #df8c49;
        display: flex;
        width: 80%;
        margin: 0px auto;
        gap: 10px;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      #page03 ul {
        display: flex;
        width: 80%;
        margin: 0px auto;
        gap: 10px;
        align-items: center;
        justify-content: center;
        margin-top: 50px;
        /* display: none; */
        transition-delay: 0.5s;
      }
      #page03 h2 {
        transform: translateY(50px);
        font-size: 3rem;
        transition: 0.5s;
        opacity: 0;
      }
      #page03.on h2 {
        transform: translateY(0);
        opacity: 1;
      }
      #page03 li {
        transform: translateY(50px);
        transition: 0.5s;
        opacity: 0;
      }
      #page03 li:nth-of-type(1){
        transition-delay: 0.7s;
      }
      #page03 li:nth-of-type(2){
        transition-delay: 1.4s;
      }
      #page03 li:nth-of-type(3){
        transition-delay: 2.1s;
      }
      #page03.on li {
        transform: translateY(0);
        opacity: 1;
      }

      #page04 {
        background-color: rgb(255, 127, 223);
      }

      img {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="containar">
      <section id="page01"></section>
      <section id="page02">
        <div>
          <h2>사랑받는 인기 팝송</h2>
          <p>
            팝송 해석과 함께 영상 편집을 했어요<br />
            인기 팝송 100곡 모두 해석해버리기
          </p>
        </div>
      </section>
      <section id="page03">
        <div>
          <h2>변화와 성장을 쌓아온 20년의 이야기</h2>
          <ul>
            <li>
              <img src="img/pic1.jpg" alt="술잔" />
              <p>꾸준함이 여물다</p>
            </li>
            <li>
              <img src="img/pic2.jpg" alt="술잔" />
              <p>유연함이 여물다</p>
            </li>
            <li>
              <img src="img/pic3.jpg" alt="술잔" />
              <p>다양함이 여물다</p>
            </li>
          </ul>
        </div>
      </section>
      <section id="page04"></section>
    </div>
    <script>
      $(window).on("scroll", function () {
        let sc = $(window).scrollTop();
        // console.log(sc);
        let pg02 = $("#page02").offset().top;
        let pg03 = $("#page03").offset().top;
        if (sc >= pg02 - 200) {
          $("#page02").addClass("on");
        } else {
          $("#page02").removeClass("on");
        }
        if (sc >= pg03 - 200) {
          $("#page03").addClass("on");
        } else {
          $("#page03").removeClass("on");
        }
      });
    </script>
  </body>
</html>
