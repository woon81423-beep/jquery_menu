<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
        display: block;
      }
      /**/
      body {
        width: 90%;
        margin: 0px auto;
      }
      h2 {
        margin-top: 50px;
        font-size: 1.5rem;
      }
      ul {
        display: flex;
        width: 100%;
        margin: 50px auto;
        gap: 20px;
        color: #fff;
      }
      li {
        width: 50%;
        height: 40vh;
        transition: 0.5s;
        filter: grayscale(50%);
        background-size: cover;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        padding: 10% 3% 0%;
        border-radius: 20px;
      }
      li:first-child {
        background: url(img/pic1.jpg) center center no-repeat;
        background-size: cover;
      }
      li:last-child {
        background: url(img/pic2.jpg) center center no-repeat;
        background-size: cover;
      }
      div {
        border: 1px solid #fff;
        border-radius: 10px;
        width: 44%;
        height: 8vh;
        text-align: center;
        line-height: 8vh;
        transition: 0.5s;
      }
      .zzz {
        color: #000;
        background-color: #fff;
        border: none;
      }
      .click {
        width: 70%;
      }
    </style>
  </head>
  <body>
    <h2>
      삼성에피스홀딩스는 혁신적인 연구 역량과 미래 기술을 향한 도전으로
      바이오의약품 시장의 새로운 역사를 만들어갑니다.
    </h2>
    <ul>
      <li>
        <h3>회사소개</h3>
        <p>
          삼성에피스홀딩스는 투명하고 효율적인 경영을 통해 바이오의약품 시장을
          선도하겠습니다.
        </p>
        <div class="wrap01">
          자세히 보기 <i class="fa-solid fa-arrow-right-long"></i>
        </div>
      </li>
      <li>
        <h3>자회사소개</h3>
        <p>
          삼성에피스홀딩스는 삼성바이오에피스와 에피스넥스랩을 자회사로 보유하고
          있습니다.
        </p>
        <div>
          <a href="#"
            >자세히 보기 <i class="fa-solid fa-arrow-right-long"></i
          ></a>
        </div>
      </li>
    </ul>
    <script>
      $("li").on("mouseenter", function () {
        // $(this).css({ width: "70%" });
        $(this).addClass("click");
        $(this).children("div").addClass("zzz");
      });
      //   $("li").on("mouseenter", function () {
      //     $(this).children("div").addClass("zzz");
      //   });
      $("li").on("mouseleave", function () {
        $(this).removeClass("click");
        $(this).children("div").removeClass("zzz");
      });
      //   $("li").on("mouseleave", function () {
      //     $(this).children("div").removeClass("zzz");
      //   });
    </script>
  </body>
</html>
