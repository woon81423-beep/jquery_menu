<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
     
      .wrap01 {
        width: 300px;
        height: 300px;
        position: relative;
        /* border: 1px solid red; */
        margin: 0px auto;
      }

      .wrap01 li {
        position: absolute;
        top: 0%;
        left: 0%;
        width: 100%;
        height: 100%;
        /* display: none; */
      }
      .wrap01 img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .wrap01 li:first-child {
        display: block;
      }
      .wrap02 {
        display: flex;
        justify-content: center;
        gap: 10px;
        width: 80%;
        margin: 10px auto;
      }
      .wrap02 li {
        width: 100px;
        cursor: pointer;
      }
      .wrap02 img {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div>
      <ul class="wrap01">
        <li><img src="img/pic1.jpg" alt="주점" /></li>
        <li><img src="img/pic2.jpg" alt="주점" /></li>
        <li><img src="img/pic3.jpg" alt="주점" /></li>
        <li><img src="img/pic4.jpg" alt="주점" /></li>
      </ul>
      <ul class="wrap02">
        <li><img src="img/pic1.jpg" alt="주점" /></li>
        <li><img src="img/pic2.jpg" alt="주점" /></li>
        <li><img src="img/pic3.jpg" alt="주점" /></li>
        <li><img src="img/pic4.jpg" alt="주점" /></li>
      </ul>
    </div>
    <script>
      $(".wrap02 li:nth-of-type(1)").on("click", function () {
        $(".wrap01 li").fadeOut();
        $(".wrap01 li:nth-of-type(1)").fadeIn(1000);
      });
      $(".wrap02 li:nth-of-type(2)").on("click", function () {
        $(".wrap01 li").fadeOut();
        $(".wrap01 li:nth-of-type(2)").fadeIn(1000);
      });
      $(".wrap02 li:nth-of-type(3)").on("click", function () {
        $(".wrap01 li").hide(2000);
        $(".wrap01 li:nth-of-type(3)").fadeIn(1000);
      });
      $(".wrap02 li:nth-of-type(4)").on("click", function () {
        $(".wrap01 li").hide();
        $(".wrap01 li:nth-of-type(4)").fadeIn(1000);
      });
      //   $(".b01").on("click", function () {
      //     $(".a01").fadeToggle(1000);
      //   });
    </script>
  </body>
</html>
<!--
wrap02 li 중에 첫번째 클릭하면
wrap01 li 중에 첫번째 보이게 해라

wrap02 li 중에 두번째 클릭하면
wrap01 li 중에 두번째 보이게 해라

wrap02 li 중에 세번째 클릭하면
wrap01 li 중에 세번째 보이게 해라

wrap02 li 중에 네번째 클릭하면
wrap01 li 중에 네번째 보이게 해라



-->
