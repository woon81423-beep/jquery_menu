<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
  </head>
  <body>
    <h2>10</h2>
    <script>
      setTimeout(function () {
        let count = 10;

        let stop = setInterval(function () {
          count = count - 1; 
          $("h2").text(count);
          if (count == -1) {
            clearInterval(stop);
            $("h2").text("카운트 종료");
          }
        }, 100);
      }, 500);
    </script>
  </body>
</html>
