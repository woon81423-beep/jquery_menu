<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num1 = 10;
      let num2 = 3;
      console.log(num1 + num2);
      console.log(num1 - num2);
      console.log(num1 / num2);
      console.log(num1 * num2);
      console.log(num1 % num2);
      console.log("문자" + num1 + num2);
      console.log("문자" + (num1 + num2));
    </script>
  </body>
</html>
<!--
*사칙연산
더하기 :: + (결합한다 라는 의미도 있음)
빼기 :: -
곱하기 :: *
나누기(몫) :: /
나눈 나머지 :: %

우선순위를 높이려면 괄호()
문자는 ""또는 "안에 입력함
1( 숫자) / "1"(문자) / '1' (문자)
결합을 할 때 문자가 앞에 나오면 뒤에 있는 숫자도 문자로 취급함
그래서 덧셈을 할 수 없음

1+2+"값" => 숫자+숫자+문자 =>> 3값
"값"+1+2 => 문자+숫자+숫자 =>> 값 12-->
