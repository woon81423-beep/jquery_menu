      //  $("button:nth-of-type(3)").on("click",function(){

      $("button")
        .eq(0)
        .on("click", function () {
          wrap("red");
        });
      $("button")
        .eq(1)
        .on("click", function () {
          wrap("blue");
        });
      $("button")
        .eq(2)
        .on("click", function () {
          wrap("orange");
        });
      function wrap(color) {
        $("div").css({ "background-color": color });
      }
    </script>
