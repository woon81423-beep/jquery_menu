<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery-4.0.0.min.js"></script>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul {
        display: flex;
        gap: 10px;
      }
      li {
        width: 200px;
        height: 50px;
        text-align: center;
        line-height: 50px;
        background-color: #eee;
        position: relative;
      }
      .line {
        width: 0%;
        height: 2px;
        background-color: #000;
        transform:translate(-50%);
        position: absolute;
        left:50%;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>
        <a href="#">
          <p>menu01</p>
          <div class="line"></div>
        </a>
      </li>
      <li>
        <a href="#">
          <p>menu02</p>
          <div class="line"></div>
        </a>
      </li>
      <li>
        <a href="#">
          <p>menu03</p>
          <div class="line"></div>
        </a>
      </li>
      <li>
        <a href="#">
          <p>menu04</p>
          <div class="line"></div>
        </a>
      </li>
    </ul>

    <script>
      $("li").on("mouseenter", function () {
        $(this).find(".line").stop().animate({ width: "100%" });
      });
      $("li").on("mouseleave", function () {
        $(this).find(".line").stop().animate({ width: "0%" });
      });
    </script>
  </body>
</html>
